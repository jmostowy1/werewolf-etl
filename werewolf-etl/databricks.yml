# Declarative Automation Bundle configuration, more info here: https://docs.databricks.com/en/dev-tools/bundles/settings.html
bundle:
  name: "werewolf-etl"

include:
  - resources/*.yml

variables:
  catalog:
    description: Destination catalog containing bronze, silver, and gold schemas
  source_path:
    description: Existing volume directory containing completed episode JSON files
  warehouse_id:
    description: Existing SQL warehouse used by the performance dashboard
  gold_min_games:
    description: Minimum distinct games for gold ranking eligibility
    default: "20"

sync:
  exclude:
    - tests/**
    - docs/**
    - "**/__pycache__/**"

targets:
  prod:
    mode: production
    default: true
    workspace:
      host: https://dbc-b14fd7ae-c2b5.cloud.databricks.com
      root_path: /Users/jmos623@yahoo.com/.bundle/${bundle.name}/${bundle.target}
    run_as:
      user_name: jmos623@yahoo.com
    variables:
      catalog: workspace
      source_path: /Volumes/workspace/landing/landing/
      warehouse_id: "3f5e230aa22fb0a1"
