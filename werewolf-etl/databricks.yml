# Declarative Automation Bundle configuration, more info here: https://docs.databricks.com/en/dev-tools/bundles/settings.html
bundle:
  name: "werewolf-etl"

include:
  - resources/*.yml
  - resources/*/*.yml

targets:
  # The 'dev' target, for development purposes. This target is the default.
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-b14fd7ae-c2b5.cloud.databricks.com

  # The 'prod' target, used for production deployment.
  prod:
    mode: production
    workspace:
      host: https://dbc-b14fd7ae-c2b5.cloud.databricks.com
      # We always use /Users/jmos623@yahoo.com for all resources to make sure we only have a single copy.
      root_path: /Users/jmos623@yahoo.com/.bundle/${bundle.name}/${bundle.target}
    run_as:
      # This runs as jmos623@yahoo.com in production. We could also use a service principal here,
      # see https://docs.databricks.com/dev-tools/bundles/permissions.html.
      user_name: jmos623@yahoo.com
